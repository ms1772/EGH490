# Refuse-to-proceed gates and the managed-parameter allow-list.
#
# Consumed by flight_ops/snapshot.py. Two independent jobs:
#
#   gates.must_equal      Hard expected values. A mismatch means the shared
#                         hardware is not in the state this project left it in
#                         -- most likely someone else's setup is live. ABORT.
#
#   gates.baseline_compare  Glob patterns. Any parameter matching one of these
#                         that differs from the reference snapshot is reported.
#                         Differences are a stop-and-ask, not an auto-abort,
#                         because legitimate tuning lands here too.
#
#   managed_params        The ONLY parameters this project is ever allowed to
#                         write. Applied in listed order; rollback restores in
#                         strict reverse order from the snapshot's captured
#                         values. Values live in px4_indoor_params.yaml (S5),
#                         deliberately NOT here -- this file is about what may
#                         be touched, not what it is set to.

gates:
  must_equal:
    # uXRCE-DDS transport over Ethernet. If any of these have moved, the FC is
    # configured for someone else's session. Do not proceed, do not "fix" it.
    UXRCE_DDS_CFG: 1000        # Ethernet
    UXRCE_DDS_PRT: 8888
    UXRCE_DDS_KEY: 1
    UXRCE_DDS_DOM_ID: 0
    # NOT gated to a single value: UXRCE_DDS_NS_IDX is PER AIRFRAME (see
    # managed_params below), so a fixed expectation here would fail on two of
    # the three drones.

  baseline_compare:
    - "EKF2_*"
    - "MPC_*"
    - "COM_*"
    - "GF_*"
    - "RTL_*"
    - "UXRCE_*"

# Applied in this order. Rollback walks it backwards.
managed_params:
  # --- multi-aircraft topic separation --------------------------------------
  # PER-AIRFRAME VALUE, and the only one in this list that differs between
  # drones: 0, 1, 2. PX4 v1.17 defines UXRCE_DDS_NS_IDX as "an index-based
  # namespace for DDS messages, e.g. uav_0, uav_1", default -1 = no namespace.
  # Verified in src/modules/uxrce_dds_client/module.yaml at tag v1.17.0.
  #
  # Without it all three aircraft publish bare /fmu/... on ROS_DOMAIN_ID 0, so
  # every platform would fuse all three FCs' odometry and a volume_guard
  # disarm would reach every aircraft at once. With it, each FC publishes
  # /uav_N/fmu/..., and as2_platform_pixhawk's fmu_prefix absorbs the naming
  # difference while the Aerostack2 namespace stays drone0/1/2.
  #
  # reboot_required. Range -1..9999.
  - UXRCE_DDS_NS_IDX

  # --- external vision aiding (indoor mocap) -------------------------------
  - EKF2_EV_DELAY            # vision latency compensation
  - EKF2_EV_CTRL             # which vision measurements are fused
  - EKF2_GPS_CTRL            # GPS aiding off indoors
  - EKF2_HGT_REF             # height reference source
  - EKF2_EVP_NOISE           # vision position noise
  - EKF2_EVA_NOISE           # vision angle noise

  # --- indoor envelope limits ----------------------------------------------
  - MPC_XY_VEL_MAX
  - MPC_XY_CRUISE
  - MPC_Z_VEL_MAX_UP
  - MPC_Z_VEL_MAX_DN
  - MPC_TILTMAX_AIR

  # --- geofence ------------------------------------------------------------
  # UNPROVEN INDOORS: GF_MAX_*_DIST is evaluated against GLOBAL position, and
  # GF_SOURCE defaults to GPOS. With EKF2_GPS_CTRL=0 and no GNSS, EKF2 only
  # publishes a global position once an EKF origin exists -- so the fence may
  # never arm at all. Bench-test it (push past GF_MAX_HOR_DIST and confirm a
  # breach actually fires) before treating it as a real boundary. GF_SOURCE is
  # in the allow-list so it MAY be changed once that test says what is needed;
  # its value is deliberately not fixed in px4_indoor_params.yaml yet.
  # This is also why volume_guard (S2) is the primary fence, not this.
  - GF_ACTION
  - GF_SOURCE
  - GF_MAX_HOR_DIST
  - GF_MAX_VER_DIST

  # --- failsafe behaviour ---------------------------------------------------
  # In an 8x6x4 m netted volume the offboard-loss action must be Land.
  # RTL_RETURN_ALT=2 is a manoeuvre in this room, not a return.
  - COM_OBL_RC_ACT
  # COM_POS_FS_DELAY intentionally absent: it does NOT exist in PX4 v1.17.
  # Removed in v1.16.0 (PX4-Autopilot PR #24063); the position-loss delay is
  # now fixed at 1 s and is no longer tunable. Listing it here would make
  # snapshot.py report it missing on every run, forever.
  - COM_DISARM_LAND
  - NAV_DLL_ACT
  - RTL_RETURN_ALT
  - RTL_DESCEND_ALT

# Hosts that snapshot.py will try to reach over ssh (BatchMode only -- set up
# key auth first; no password is ever stored in this repo).
hosts:
  - name: jetson-drone3
    user: jetson
    addr: 10.88.51.230
