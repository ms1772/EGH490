[pytest]
# `pythonpath = .` is load-bearing. Several test modules do
# `from tests.automation import metrics`, which previously only resolved when
# pytest happened to be invoked from the repo root (the __init__.py chain made
# pytest insert it into sys.path as a side effect). Making it explicit means the
# suite runs from anywhere, and it pre-empts the same problem for planner/tests.
pythonpath = .

testpaths =
    tests
    planner/tests
    perception/tests

# Collection must not walk the results tree. `testpaths` includes `tests`, and
# run directories live under `tests/automation/results/` -- after one campaign
# that is 9543 files and ~40 GB of bags, on a 9p mount from WSL. Collection
# alone then takes longer than the entire suite: a full run timed out at 560 s
# without emitting a single line, having never reached a test. Excluding it
# costs nothing (there are no tests in there) and keeps the suite runnable
# after any number of campaigns.
norecursedirs =
    tests/automation/results
    .git
    __pycache__
    *.egg-info

markers =
    slow: end-to-end checks that run the planner as a subprocess (deselect with '-m "not slow"')

# Keep the default run fast enough that it actually gets run between steps.
addopts = -q
